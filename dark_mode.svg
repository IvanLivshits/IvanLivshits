.main{animation:jolt 7s infinite}.g1{animation:ghost 7s infinite}.g2{animation:ghost 7s infinite reverse}
.cur{animation:blink 1s infinite}.dot{animation:blink 2s infinite}.sweep{animation:sweep 6s linear infinite}
